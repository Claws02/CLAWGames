<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal Stack art</title>
<link rel="preload" href="../assets/fonts/BebasNeue-Regular.woff2" as="font" crossorigin>
<style>
@font-face{font-family:'Bebas Neue';src:url(../assets/fonts/BebasNeue-Regular.woff2)}
body{margin:0;background:#9fd8ff;font-family:'Bebas Neue',Impact,sans-serif;color:#2d3440}
h1{margin:12px 16px 0;font-weight:normal;letter-spacing:2px}
.grid{display:flex;flex-wrap:wrap;gap:10px;padding:12px}
figure{margin:0;background:#d9f1ff;border-radius:16px;padding:6px;text-align:center}
figcaption{font-size:20px;letter-spacing:1px}
</style></head><body>
<h1>Animal Stack: the art (add ?parts for the physics shapes)</h1>
<div class="grid" id="g"></div>
<script type="module">
import { ART } from '../src/games/AnimalArt.js';
const showParts = /parts/.test(location.search);
const big = 150, small = 68;
for (const def of Object.values(ART)) {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    const W = 260, H = 300, dpr = 2;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const draw = (k, x, y, ang = 0) => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(-ang); ctx.scale(k, -k);
        def.draw(ctx, false);
        if (showParts) { ctx.setLineDash([0.04, 0.04]); ctx.lineWidth = 0.02; ctx.strokeStyle = '#e8463c';
            def.parts.forEach(p => { ctx.beginPath(); p.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.stroke(); }); }
        ctx.restore();
    };
    const pts = def.parts.flat(), xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
    const bw = Math.max(...xs) - Math.min(...xs) + 0.4, bh = Math.max(...ys) - Math.min(...ys) + 0.4;
    const k = Math.min(big, 240 / bw, 200 / bh);
    draw(k, W / 2 - k * (Math.max(...xs) + Math.min(...xs)) / 2, 110 + k * (Math.max(...ys) + Math.min(...ys)) / 2);
    // At game size, upright and tumbled, plus the "fell off" face.
    const sm = Math.min(small, 70 / bw * 1.6); draw(sm, 50, 255); draw(sm, 130, 255, 0.6);
    ctx.save(); ctx.translate(210, 255); ctx.scale(sm, -sm); def.draw(ctx, true); ctx.restore();
    fig.append(c);
    const cap = document.createElement('figcaption'); cap.textContent = def.name; fig.append(cap);
    document.getElementById('g').append(fig);
}
document.body.dataset.ready = 1;
</script></body></html>
