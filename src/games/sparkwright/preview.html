<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sparkwright — campaign preview</title>
<style>
  html,body{margin:0;height:100%;background:#0b1622;color:#d8ecff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #app{position:fixed;inset:0}
  .menu{position:absolute;inset:0;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 24px;background:
    linear-gradient(rgba(80,150,210,.07) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(80,150,210,.07) 1px,transparent 1px) 0 0/24px 24px,#0b1622}
  .menu h1{margin:0;font-size:30px;letter-spacing:.18em;color:#ffcf3d}
  .menu .sub{color:#6f8fae;font-size:12px;margin:4px 0 20px;letter-spacing:.06em}
  .world{margin:18px 0 8px;color:#5cb8e6;font-size:11px;letter-spacing:.14em}
  .lv{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;background:#0d1d2c;border:1px solid #2c4a66;border-radius:8px;color:#d8ecff;font:inherit;text-align:left;padding:12px;margin-bottom:8px}
  .lv:disabled{opacity:.4}
  .lv .n{font-size:20px;color:#5cb8e6;width:36px}
  .lv .name{font-weight:700}
  .lv .c{color:#6f8fae;font-size:11px;margin-top:2px}
  .lv .best{margin-left:auto;font-size:12px;color:#3dffa2;text-align:right}
  .foot{color:#6f8fae;font-size:11px;margin-top:18px;max-width:520px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// Standalone Sparkwright: the same campaign the app runs (Home Base + shifts).
// ?all unlocks every door · ?reset wipes this browser's progress.
import { createCampaign } from './Campaign.js';

const KEY = 'sparkwright.progress.v1';
const q = new URLSearchParams(location.search);
if (q.has('reset')) { try { localStorage.removeItem(KEY); } catch (e) {} }
const store = {
  load: () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  save: v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
};
const app = document.getElementById('app');
function start() {
  app.innerHTML = '';
  window.__swrCampaign = createCampaign(app, {
    store, unlockAll: q.has('all'),
    onExit: () => { window.__swrCampaign.destroy(); bye(); },
  });
}
function bye() {
  app.innerHTML = '<div class="menu"><h1>SPARKWRIGHT</h1><div class="sub">FIELD ENGINEER</div><button class="lv" id="again"><span class="n">▶</span><span><div class="name">Back to Home Base</div><div class="c">Your progress is saved on this device</div></span></button></div>';
  document.getElementById('again').onclick = start;
}
start();
</script>
</body>
</html>
